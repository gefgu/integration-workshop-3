[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-validator"
version = "0.1.0"
description = "Circuit graph validation for the TedTronics workbench"
requires-python = ">=3.10"
dependencies = [
  "networkx>=3.2",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]
# Tutor voice (Piper pt_BR-cadu-medium -> MP3). Voice model: graph_validator/tools/fetch_voice.sh
tts = ["piper-tts>=1.8", "lameenc>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
