ch-text" data-schematic-text-id="schematic_text_8" x="457.616254713" y="805.9363217431" fill="#000000" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans" font-size="14.39044826145px" transform="rotate(0, 457.616254713, 805.9363217431)">Independent 5 V / 3V3 guards</text><text class="sch-text" data-schematic-text-id="schematic_text_9" x="457.616254713" y="844.3108504403" fill="#000000" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans" font-size="14.39044826145px" transform="rotate(0, 457.616254713, 844.3108504403)">Current trip and fault latch</text><text class="sch-text" data-schematic-text-id="schematic_text_10" x="457.616254713" y="882.6853791374999" fill="#000000" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans" font-size="14.39044826145px" transform="rotate(0, 457.616254713, 882.6853791374999)">Protected student supply</text><text class="sch-text" data-schematic-text-id="schematic_text_11" x="457.616254713" y="921.0599078347" fill="#000000" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans" font-size="14.39044826145px" transform="rotate(0, 457.616254713, 921.0599078347)">Detail: sheet 3</text><text class="sch-text" data-schematic-text-id="schematic_text_12" x="918.1105990794" y="729.1872643487" fill="#000000" text-anchor="start" dominant-baseline="middle" font-family="DejaVu Sans" font-size="21.10599078346px" transform="rotate(0, 918.1105990794, 729.1872643487)">Routing matrix</text><text class="sch-text" data-schematic-text-id="schematic_text_13" x="1205.9195643084" y="767.5617930459" fill="#000000" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans" font-size="14.39044826145px" transform="rotate(0, 1205.9195643084, 767.5617930459)">ESP1 and watchdog</text><text class="sch-text" data-schematic-text-id="schematic_text_14" x="1205.9195643084" y="805.9363217431" fill="#000000" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans"